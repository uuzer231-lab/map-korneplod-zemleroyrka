<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тест Карта</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #0f172a; }
        
        /* Простая интерактивная область карты без Leaflet */
        #map-viewport {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .map-bg {
            position: absolute;
            width: 2000px;
            height: 2000px;
            background-image: 
                linear-gradient(to right, #cbd5e1 1px, transparent 1px),
                linear-gradient(to bottom, #cbd5e1 1px, transparent 1px);
            background-size: 50px 50px;
            background-color: #f1f5f9;
        }

        /* Маркеры */
        .marker {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.9);
            border: 3px solid #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .marker.viktor { border-color: #f97316; }
        .marker.anastasia { border-color: #ec4899; }

        .top-controls {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
        }
        .btn-admin {
            background: #1e293b;
            color: #f59e0b;
            border: 1px solid #334155;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Модалка */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: none;
            align-items: center; justify-content: center;
            z-index: 2000;
        }
        .modal.active { display: flex; }
        .modal-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            color: white;
            width: 90%;
            max-width: 350px;
        }
        .modal-card input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
        }
        .modal-card button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="map-viewport">
        <div class="map-bg" id="mapBg"></div>
        <div class="marker viktor" id="mViktor" style="left: 50%; top: 45%;">🧔</div>
        <div class="marker anastasia" id="mAnastasia" style="left: 52%; top: 55%;">🧓</div>
    </div>

    <div class="top-controls">
        <button class="btn-admin" onclick="openAdmin()">⚙️ Админка</button>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-card">
            <h3>Админ-панель</h3>
            <input type="password" id="pass" placeholder="Пароль">
            <button onclick="checkPass()">Войти</button>
            <button onclick="closeAdmin()" style="background:#475569; margin-top:8px;">Закрыть</button>
        </div>
    </div>

    <script>
        // Простая логика без внешних библиотек
        function openAdmin() {
            document.getElementById('adminModal').classList.add('active');
        }
        function closeAdmin() {
            document.getElementById('adminModal').classList.remove('active');
        }
        function checkPass() {
            const p = document.getElementById('pass').value;
            if(p === "KorneplodViktor_2024000") {
                alert("Успешно! Доступ есть.");
                closeAdmin();
            } else {
                alert("Неверный пароль!");
            }
        }

        // Перетаскивание карты пальцем
        const viewport = document.getElementById('map-viewport');
        let isDown = false, startX, startY, scrollLeft = 0, scrollTop = 0;

        viewport.addEventListener('pointerdown', (e) => {
            isDown = true;
            startX = e.clientX;
            startY = e.clientY;
        });
        window.addEventListener('pointermove', (e) => {
            if(!isDown) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            startX = e.clientX;
            startY = e.clientY;

            const v = document.getElementById('mapBg');
            const curLeft = parseInt(v.style.left || 0);
            const curTop = parseInt(v.style.top || 0);
            v.style.left = (curLeft + dx) + 'px';
            v.style.top = (curTop + dy) + 'px';
        });
        window.addEventListener('pointerup', () => isDown = false);
    </script>
</body>
</html>
