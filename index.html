<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта: Виктор Корнеплод и Анастасия Землеройка</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }
        /* Анимированные кастомные маркеры */
        .character-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .character-marker:hover {
            transform: scale(1.25) translateY(-6px);
        }
        .picking-location {
            cursor: crosshair !important;
        }

        /* Стильный темно-градиентный Popup Leaflet */
        .leaflet-popup-content-wrapper {
            background: #0f172a !important; /* bg-slate-900 */
            color: #f8fafc !important;
            border-radius: 1.25rem !important;
            border: 1px solid #334155;
            padding: 4px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .leaflet-popup-tip {
            background: #0f172a !important;
        }
        .leaflet-popup-close-button {
            color: #94a3b8 !important;
            padding: 8px !important;
        }
        .leaflet-popup-close-button:hover {
            color: #ffffff !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden relative">

    <!-- Кнопка админки (компактная в верхнем углу) -->
    <div class="absolute top-4 right-4 z-[1000]">
        <button id="adminToggleBtn" onclick="toggleAdminPanel()" class="bg-slate-900/90 hover:bg-slate-800 text-amber-400 font-bold px-4 py-2.5 rounded-2xl border border-slate-700 shadow-2xl flex items-center gap-2 text-xs md:text-sm transition-all active:scale-95 backdrop-blur-md">
            <i class="fa-solid fa-gear text-amber-400" id="lockIcon"></i>
            <span id="adminBtnText">Админка</span>
        </button>
    </div>

    <!-- Модальная плавающая Админ-панель -->
    <div id="adminPanel" class="hidden absolute top-16 right-4 z-[1000] w-80 md:w-96 bg-slate-900/95 border-2 border-amber-500/50 rounded-3xl p-5 shadow-2xl backdrop-blur-xl transition-all">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
            <span class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> Управление координатами
            </span>
            <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-white p-1">
                <i class="fa-solid fa-xmark fa-lg"></i>
            </button>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Персонаж:</label>
                <select id="adminCharSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs font-semibold text-slate-100 focus:outline-none focus:border-amber-500">
                    <option value="viktor">Виктор Корнеплод 🧔</option>
                    <option value="anastasia">Анастасия Землеройка 🧓</option>
                </select>
            </div>

            <!-- Режим интерактивного выбора по клику -->
            <div>
                <button id="pickOnMapBtn" onclick="toggleMapPickerMode()" class="w-full bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 py-2.5 px-3 rounded-xl text-xs font-semibold transition-all flex items-center justify-center gap-2 active:scale-95">
                    <i class="fa-solid fa-hand-pointer"></i>
                    <span id="pickOnMapText">Указать точку кликом по карте</span>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Широта (Lat)</label>
                    <input type="number" step="any" id="inputLat" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs font-mono text-slate-100 focus:outline-none focus:border-amber-500" placeholder="55.7558">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Долгота (Lng)</label>
                    <input type="number" step="any" id="inputLng" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs font-mono text-slate-100 focus:outline-none focus:border-amber-500" placeholder="37.6173">
                </div>
            </div>

            <div class="pt-2 flex gap-2">
                <button onclick="saveNewCoordinates()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition-all shadow-lg shadow-amber-500/20 active:scale-95">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Сохранить
                </button>
                <button onclick="resetToDefaults()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-3.5 py-2.5 rounded-xl text-xs border border-slate-700 transition-all active:scale-95" title="Сбросить к исходным">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Основная карта на весь экран -->
    <div id="map"></div>

    <!-- Индикатор выбора точки на карте -->
    <div id="pickerBanner" class="hidden absolute top-5 left-1/2 -translate-x-1/2 z-[1000] bg-amber-500 text-slate-950 font-bold px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-3 text-xs md:text-sm border-2 border-white animate-bounce">
        <i class="fa-solid fa-location-crosshairs text-base"></i>
        <span>Кликните по карте, чтобы выбрать новые координаты!</span>
        <button onclick="toggleMapPickerMode(false)" class="ml-2 bg-slate-900/20 hover:bg-slate-900/40 rounded-full w-5 h-5 flex items-center justify-center text-slate-950 font-extrabold">&times;</button>
    </div>

    <!-- Модальное окно авторизации -->
    <div id="authModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[2000] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl relative">
            <div class="text-center mb-5">
                <div class="w-14 h-14 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-amber-500/20 shadow-inner">
                    <i class="fa-solid fa-user-shield fa-xl"></i>
                </div>
                <h3 class="text-lg font-bold text-white">Вход в Админ-панель</h3>
                <p class="text-xs text-slate-400 mt-1">Введите пароль для доступа к управлению</p>
            </div>

            <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <input type="password" id="adminPasswordInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition-colors" placeholder="Введите пароль..." required autofocus>
                    <p id="authErrorMsg" class="text-red-400 text-xs mt-2 hidden flex items-center gap-1">
                        <i class="fa-solid fa-triangle-exclamation"></i> Неверный пароль!
                    </p>
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="closeAuthModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl text-xs transition-all">
                        Отмена
                    </button>
                    <button type="submit" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition-all shadow-lg shadow-amber-500/20">
                        Войти
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Уведомления (Toast) -->
    <div id="toast" class="fixed bottom-6 right-6 z-[2000] transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 border border-amber-500/50 text-amber-400 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-lg"></i>
        <span id="toastMsg" class="text-xs font-semibold text-slate-100">Сообщение</span>
    </div>

    <script>
        // Начальные координаты и данные
        const DEFAULT_DATA = {
            viktor: {
                name: "Виктор Корнеплод",
                lat: 55.7558,
                lng: 37.6173,
                updatedAt: "2026-10-18 12:00:00",
                icon: "🧔",
                bgColor: "bg-amber-600",
                borderColor: "#f59e0b",
                textColor: "text-amber-400"
            },
            anastasia: {
                name: "Анастасия Землеройка",
                lat: 59.9342,
                lng: 30.3351,
                updatedAt: "2026-10-18 12:00:00",
                icon: "🧓",
                bgColor: "bg-purple-600",
                borderColor: "#c084fc",
                textColor: "text-purple-400"
            }
        };

        // Новый пароль администратора (можно изменить здесь в коде)
        const ADMIN_PASSWORD = "корнеплод2026";

        let charactersData = {};
        let map;
        let markers = {};
        let isAdminLoggedIn = false;
        let isPickingOnMap = false;

        window.onload = function() {
            loadStoredData();
            initMap();
            updateAdminInputValues();
        };

        function loadStoredData() {
            const stored = localStorage.getItem('character_locations_data');
            if (stored) {
                try {
                    charactersData = JSON.parse(stored);
                } catch(e) {
                    charactersData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            } else {
                charactersData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('character_locations_data', JSON.stringify(charactersData));
        }

        function initMap() {
            map = L.map('map', {
                zoomControl: false
            }).setView([57.8450, 33.9762], 6);

            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            Object.keys(charactersData).forEach(key => {
                createOrUpdateMarker(key);
            });

            map.on('click', function(e) {
                if (isPickingOnMap) {
                    const lat = parseFloat(e.latlng.lat.toFixed(5));
                    const lng = parseFloat(e.latlng.lng.toFixed(5));

                    document.getElementById('inputLat').value = lat;
                    document.getElementById('inputLng').value = lng;

                    toggleMapPickerMode(false);
                    showToast("Координаты выбраны на карте!");
                }
            });
        }

        function createOrUpdateMarker(key) {
            const char = charactersData[key];

            const customIcon = L.divIcon({
                className: 'custom-leaflet-icon',
                html: `
                    <div class="character-marker ${char.bgColor} w-12 h-12 text-2xl text-white border-2 shadow-2xl flex items-center justify-center" style="border-color: ${char.borderColor}">
                        ${char.icon}
                    </div>
                `,
                iconSize: [48, 48],
                iconAnchor: [24, 24],
                popupAnchor: [0, -24]
            });

            const popupContent = `
                <div class="text-slate-100 font-sans p-2 min-w-[200px]">
                    <div class="flex items-center gap-3 mb-3 border-b border-slate-800 pb-2">
                        <span class="text-3xl">${char.icon}</span>
                        <div>
                            <h3 class="font-bold text-base ${char.textColor} leading-tight">${char.name}</h3>
                            <span class="text-[10px] text-slate-400">Персонаж</span>
                        </div>
                    </div>
                    <div class="bg-slate-950/80 rounded-xl p-2.5 mb-2.5 text-xs font-mono space-y-1 border border-slate-800">
                        <div class="flex justify-between"><span class="text-slate-400">Широта:</span> <span class="text-white font-semibold">${char.lat}</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Долгота:</span> <span class="text-white font-semibold">${char.lng}</span></div>
                    </div>
                    <div class="text-[11px] text-slate-400 flex items-center gap-1.5 pt-1">
                        <i class="fa-regular fa-clock ${char.textColor}"></i>
                        <span>Обновлено: <b class="text-slate-200">${char.updatedAt}</b></span>
                    </div>
                </div>
            `;

            if (markers[key]) {
                markers[key].setLatLng([char.lat, char.lng]);
                markers[key].getPopup().setContent(popupContent);
            } else {
                const marker = L.marker([char.lat, char.lng], { icon: customIcon }).addTo(map);
                marker.bindPopup(popupContent);
                markers[key] = marker;
            }
        }

        function updateAdminInputValues() {
            const selectedChar = document.getElementById('adminCharSelect').value;
            if (charactersData[selectedChar]) {
                document.getElementById('inputLat').value = charactersData[selectedChar].lat;
                document.getElementById('inputLng').value = charactersData[selectedChar].lng;
            }
        }

        document.getElementById('adminCharSelect').addEventListener('change', updateAdminInputValues);

        function toggleAdminPanel() {
            if (isAdminLoggedIn) {
                const panel = document.getElementById('adminPanel');
                panel.classList.toggle('hidden');
            } else {
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('adminPasswordInput').focus();
            }
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('authErrorMsg').classList.add('hidden');
            document.getElementById('adminPasswordInput').value = '';
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                closeAuthModal();
                
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('lockIcon').className = "fa-solid fa-lock-open text-amber-400";
                
                showToast("Успешный вход в Админ-панель!");
                updateAdminInputValues();
            } else {
                document.getElementById('authErrorMsg').classList.remove('hidden');
            }
        }

        function toggleMapPickerMode(forceState) {
            if (forceState !== undefined) {
                isPickingOnMap = forceState;
            } else {
                isPickingOnMap = !isPickingOnMap;
            }

            const mapElement = document.getElementById('map');
            const banner = document.getElementById('pickerBanner');
            const btnText = document.getElementById('pickOnMapText');

            if (isPickingOnMap) {
                mapElement.classList.add('picking-location');
                banner.classList.remove('hidden');
                btnText.textContent = "Отменить выбор";
            } else {
                mapElement.classList.remove('picking-location');
                banner.classList.add('hidden');
                btnText.textContent = "Указать точку кликом по карте";
            }
        }

        function getCurrentFormattedDateTime() {
            const now = new Date();
            const date = now.toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
            const time = now.toLocaleTimeString('ru-RU', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            return `${date} ${time}`;
        }

        function saveNewCoordinates() {
            const selectedChar = document.getElementById('adminCharSelect').value;
            const lat = parseFloat(document.getElementById('inputLat').value);
            const lng = parseFloat(document.getElementById('inputLng').value);

            if (isNaN(lat) || isNaN(lng)) {
                showToast("Введите корректные координаты!", true);
                return;
            }

            charactersData[selectedChar].lat = lat;
            charactersData[selectedChar].lng = lng;
            charactersData[selectedChar].updatedAt = getCurrentFormattedDateTime();

            saveToLocalStorage();
            createOrUpdateMarker(selectedChar);

            map.flyTo([lat, lng], 12, { duration: 1 });
            setTimeout(() => {
                markers[selectedChar].openPopup();
            }, 1100);

            showToast(`Координаты ${charactersData[selectedChar].name} сохранены!`);
        }

        function resetToDefaults() {
            if (confirm("Сбросить координаты персонажей к начальным?")) {
                charactersData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveToLocalStorage();
                Object.keys(charactersData).forEach(key => createOrUpdateMarker(key));
                updateAdminInputValues();
                showToast("Координаты сброшены!");
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            toastMsg.textContent = message;
            if (isError) {
                toast.classList.remove('border-amber-500/50', 'text-amber-400');
                toast.classList.add('border-red-500/50', 'text-red-400');
            } else {
                toast.classList.remove('border-red-500/50', 'text-red-400');
