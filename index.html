<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Світло Львівщина</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #090d16;
            --surface: #131b2e;
            --surface-card: #1b2640;
            --border: #2a3959;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.2);
            --red: #f43f5e;
            --red-glow: rgba(244, 63, 94, 0.2);
            --accent: #6366f1;
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }

        .app {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .logo-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .update-pill {
            background: var(--surface-card);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .controls {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .groups-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .group-btn {
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 6px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            user-select: none;
            transition: all 0.2s;
        }

        .group-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .group-btn.test-btn {
            grid-column: span 4;
            background: rgba(245, 158, 11, 0.15);
            border-color: #f59e0b;
            color: #f59e0b;
        }

        .group-btn.test-btn.active {
            background: #f59e0b;
            color: #000;
        }

        .days-switch {
            display: flex;
            background: var(--surface-card);
            padding: 4px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .day-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .main-status {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .main-status.is-on {
            border-color: var(--green);
            background: linear-gradient(180deg, var(--surface) 0%, var(--green-glow) 100%);
        }

        .main-status.is-off {
            border-color: var(--red);
            background: linear-gradient(180deg, var(--surface) 0%, var(--red-glow) 100%);
        }

        .status-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .is-on .status-circle {
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
        }

        .is-off .status-circle {
            background: rgba(244, 63, 94, 0.15);
            color: var(--red);
        }

        .status-header {
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .is-on .status-header { color: var(--green); }
        .is-off .status-header { color: var(--red); }

        .status-sub {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .status-sub span {
            color: var(--text-main);
            font-weight: 700;
        }

        .timeline-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }

        .timeline-bar {
            height: 24px;
            background: var(--green);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .timeline-off {
            position: absolute;
            top: 0;
            bottom: 0;
            background: var(--red);
        }

        .timeline-ticks {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .outage-list-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 18px;
            margin-bottom: 10px;
        }

        .intervals-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .interval-row {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--red);
            padding: 10px 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .interval-time {
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .interval-tag {
            font-size: 0.75rem;
            background: rgba(244, 63, 94, 0.15);
            color: var(--red);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        .badge-none {
            background: var(--green-glow);
            border: 1px solid var(--green);
            color: var(--green);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            width: 100%;
            text-align: center;
        }

        .no-data {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
            <div class="logo-text">
                <h1>Світло Львівщина</h1>
                <p>Мульти-вибір груп</p>
            </div>
        </div>
        <div class="update-pill" id="updateTimeText">Щойно</div>
    </div>

    <div class="controls">
        <div class="section-label">
            <span>Виберіть групи:</span>
            <span id="selectedCount" style="color: var(--accent);">Вибрано: 1</span>
        </div>

        <div class="groups-grid" id="groupsGrid">
            <div class="group-btn test-btn" data-group="test">⚡ Група «ТЕСТ» (Приклад)</div>
            <div class="group-btn" data-group="1.1">1.1</div>
            <div class="group-btn" data-group="1.2">1.2</div>
            <div class="group-btn" data-group="2.1">2.1</div>
            <div class="group-btn" data-group="2.2">2.2</div>
            <div class="group-btn" data-group="3.1">3.1</div>
            <div class="group-btn" data-group="3.2">3.2</div>
            <div class="group-btn" data-group="4.1">4.1</div>
            <div class="group-btn" data-group="4.2">4.2</div>
            <div class="group-btn" data-group="5.1">5.1</div>
            <div class="group-btn" data-group="5.2">5.2</div>
            <div class="group-btn" data-group="6.1">6.1</div>
            <div class="group-btn" data-group="6.2">6.2</div>
        </div>

        <div class="days-switch">
            <button class="day-btn active" id="btnToday" onclick="switchDay('today')">Сьогодні</button>
            <button class="day-btn" id="btnTomorrow" onclick="switchDay('tomorrow')">Завтра</button>
        </div>
    </div>

    <div class="main-status" id="statusCard">
        <div class="status-circle" id="statusIcon">
            <i class="fa-solid fa-lightbulb"></i>
        </div>
        <div class="status-header" id="statusTitle">ПЕРЕВІРКА...</div>
        <div class="status-sub" id="statusTimer">Розрахунок...</div>
    </div>

    <div class="timeline-card">
        <div class="card-title">
            <span>Шкала доби</span>
            <span id="selectedGroupsLabel" style="color: var(--text-main);">Групи: —</span>
        </div>

        <div id="timelineContainer">
            <div class="timeline-bar" id="timelineBar"></div>
            <div class="timeline-ticks">
                <span>00:00</span>
                <span>06:00</span>
                <span>12:00</span>
                <span>18:00</span>
                <span>24:00</span>
            </div>

            <div class="outage-list-title">Години відключень:</div>
            <div class="intervals-stack" id="intervalsStack"></div>
        </div>

        <div id="noDataBox" class="no-data" style="display: none;">
            Графік на завтра ще не опубліковано Львівобленерго.
        </div>
    </div>
</div>

<script>
    const scheduleToday = {
        "test": [
            "00:00-06:00",
            "06:00-09:00",
            "09:00-12:00",
            "12:00-17:00",
            "17:00-23:00",
            "23:00-00:00"
        ],
        "1.1": [], "1.2": [], "2.1": [], "2.2": [],
        "3.1": [], "3.2": [], "4.1": [], "4.2": [],
        "5.1": [], "5.2": [], "6.1": [], "6.2": []
    };

    const scheduleTomorrow = null;

    let currentDay = 'today';
    let selectedGroups = JSON.parse(localStorage.getItem('selectedGroups')) || ['test'];

    function saveSelectedGroups() {
        localStorage.setItem('selectedGroups', JSON.stringify(selectedGroups));
    }

    function initGroupButtons() {
        const grid = document.getElementById('groupsGrid');
        const buttons = grid.querySelectorAll('.group-btn');

        buttons.forEach(btn => {
            const grp = btn.getAttribute('data-group');
            if (selectedGroups.includes(grp)) {
                btn.classList.add('active');
            }

            btn.addEventListener('click', () => {
                if (selectedGroups.includes(grp)) {
                    if (selectedGroups.length > 1) {
                        selectedGroups = selectedGroups.filter(g => g !== grp);
                        btn.classList.remove('active');
                    }
                } else {
                    selectedGroups.push(grp);
                    btn.classList.add('active');
                }
                saveSelectedGroups();
                render();
            });
        });
    }

    function switchDay(day) {
        currentDay = day;
        document.getElementById('btnToday').classList.toggle('active', day === 'today');
        document.getElementById('btnTomorrow').classList.toggle('active', day === 'tomorrow');
        render();
    }

    function parseTime(str) {
        const p = str.split(':');
        return parseInt(p[0]) * 60 + parseInt(p[1]);
    }

    function formatTime(min) {
        const h = Math.floor(min / 60).toString().padStart(2, '0');
        const m = (min % 60).toString().padStart(2, '0');
        return `${h}:${m}`;
    }

    function getCombinedIntervals(day) {
        const sch = day === 'today' ? scheduleToday : scheduleTomorrow;
        if (!sch) return [];

        let rawIntervals = [];

        selectedGroups.forEach(grp => {
            if (sch[grp]) {
                sch[grp].forEach(str => {
                    const parts = str.split('-');
                    let endMin = parseTime(parts[1]);
                    if (parts[1] === '00:00' && parseTime(parts[0]) > 0) {
                        endMin = 1440;
                    }
                    rawIntervals.push({
                        start: parseTime(parts[0]),
                        end: endMin,
                        raw: str
                    });
                });
            }
        });

        if (rawIntervals.length === 0) return [];

        rawIntervals.sort((a, b) => a.start - b.start);

        let merged = [rawIntervals[0]];
        for (let i = 1; i < rawIntervals.length; i++) {
            let last = merged[merged.length - 1];
            let curr = rawIntervals[i];

            if (curr.start <= last.end) {
                last.end = Math.max(last.end, curr.end);
            } else {
                merged.push(curr);
            }
        }

        return merged.map(m => {
            const startStr = formatTime(m.start);
            const endStr = m.end === 1440 ? '24:00' : formatTime(m.end);
            return {
                start: m.start,
                end: m.end,
                raw: `${startStr} - ${endStr}`
            };
        });
    }

    function renderStatus() {
        const card = document.getElementById('statusCard');
        const title = document.getElementById('statusTitle');
        const timer = document.getElementById('statusTimer');

        if (currentDay === 'tomorrow') {
            card.className = 'main-status';
            title.innerText = "ОЧІКУЄТЬСЯ";
            title.style.color = "var(--text-main)";
            timer.innerText = "Графік на завтра поки невідомий";
            return;
        }

        const now = new Date();
        const curMin = now.getHours() * 60 + now.getMinutes();
        const curSec = now.getSeconds();
        const intervals = getCombinedIntervals('today');

        let isOff = false;
        let activeInv = null;
        let nextInv = null;

        for (let i = 0; i < intervals.length; i++) {
            const inv = intervals[i];
            if (curMin >= inv.start && curMin < inv.end) {
                isOff = true;
                activeInv = inv;
                break;
            }
            if (inv.start > curMin) {
                if (!nextInv || inv.start < nextInv.start) nextInv = inv;
            }
        }

        if (isOff) {
            card.className = 'main-status is-off';
            title.innerText = "НЕМАЄ СВІТЛА";
            const remSec = (activeInv.end - curMin - 1) * 60 + (60 - curSec);
            const m = Math.floor(remSec / 60);
            const s = remSec % 60;
            const endFormatted = activeInv.end === 1440 ? '24:00' : formatTime(activeInv.end);
            timer.innerHTML = `Увімкнуть через: <span>${m} хв ${s} с</span> (о ${endFormatted})`;
        } else {
            card.className = 'main-status is-on';
            title.innerText = "СВІТЛО Є";
            if (nextInv) {
                const remSec = (nextInv.start - curMin - 1) * 60 + (60 - curSec);
                const m = Math.floor(remSec / 60);
                const s = remSec % 60;
                timer.innerHTML = `Вимкнуть через: <span>${m} хв ${s} с</span> (о ${formatTime(nextInv.start)})`;
            } else {
                timer.innerHTML = "До кінця дня відключень не планується";
            }
        }
    }

    function renderTimeline() {
        document.getElementById('selectedCount').innerText = `Вибрано: ${selectedGroups.length}`;
        document.getElementById('selectedGroupsLabel').innerText = `Групи: ${selectedGroups.join(', ')}`;

        const container = document.getElementById('timelineContainer');
        const noData = document.getElementById('noDataBox');
        const bar = document.getElementById('timelineBar');
        const stack = document.getElementById('intervalsStack');

        if (currentDay === 'tomorrow' && !scheduleTomorrow) {
            container.style.display = 'none';
            noData.style.display = 'block';
            return;
        }

        container.style.display = 'block';
        noData.style.display = 'none';
        bar.innerHTML = '';
        stack.innerHTML = '';

        const intervals = getCombinedIntervals(currentDay);

        intervals.forEach(inv => {
            const left = (inv.start / 1440) * 100;
            const width = ((inv.end - inv.start) / 1440) * 100;

            const seg = document.createElement('div');
            seg.className = 'timeline-off';
            seg.style.left = `${left}%`;
            seg.style.width = `${width}%`;
            bar.appendChild(seg);

            const row = document.createElement('div');
            row.className = 'interval-row';
            row.innerHTML = `
                <div class="interval-time"><i class="fa-regular fa-clock" style="color: var(--red); margin-right: 8px;"></i>${inv.raw}</div>
                <div class="interval-tag">Немає світла</div>
            `;
            stack.appendChild(row);
        });

        if (intervals.length === 0) {
            stack.innerHTML = `<div class="badge-none"><i class="fa-solid fa-circle-check"></i> Відключень немає (світло весь день)</div>`;
        }
    }

    function render() {
        renderStatus();
        renderTimeline();
    }

    initGroupButtons();
    render();

    setInterval(() => {
        renderStatus();
    }, 1000);
</script>
</body>
</html>
